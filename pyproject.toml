[project]
name = "why-voice-ai-agents-fail"
version = "0.1.0"
description = "Companion code for the talk 'Why (Voice) AI Agents Fail' by Rod Rivera (Rasa). Four runnable Python scripts demonstrating production voice-agent failure modes with Deepgram + Rime + OpenAI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Rod Rivera", email = "rod@rasa.com" },
]
keywords = ["voice-ai", "deepgram", "rime", "rasa", "conversational-ai", "asr", "tts", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "deepgram-sdk>=3.7.0,<4.0.0",
    "openai>=1.40.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "types-requests>=2.31.0",
    "jupytext>=1.16.0",
]

[project.urls]
Homepage = "https://github.com/RasaHQ/why-voice-ai-agents-fail"
Repository = "https://github.com/RasaHQ/why-voice-ai-agents-fail"
Issues = "https://github.com/RasaHQ/why-voice-ai-agents-fail/issues"

[tool.uv]
# Use uv's default resolution; lockfile committed for reproducibility.
managed = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This is a scripts repo, not a library. We expose the `scripts` package
# so editable installs work (`uv pip install -e .`).
packages = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "audio_output", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (we have a few long URLs / prompts)
    "B008",  # function call in default argument (FastAPI/click pattern)
]

[tool.ruff.lint.per-file-ignores]
# Numbered script filenames (01_*, 02_*, ...) intentionally start with a digit
# and aren't valid Python module names. They're meant to be run directly,
# not imported. The N999 + E402 rules don't apply here.
"scripts/0*.py" = ["E402", "N999"]
"tests/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["audio_output", "build", "dist", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
